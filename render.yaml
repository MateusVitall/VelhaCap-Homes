services:
  - type: web
    name: casaoeiras-api
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://casaoeiras-api.onrender.com
      - key: FRONTEND_URL
        value: https://casaoeiras.vercel.app
      - key: PORT
        value: 10000
